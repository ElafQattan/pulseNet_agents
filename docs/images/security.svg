<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="400" rx="14" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Security: the lethal trifecta in PulseNet, and where it is broken</text>

  <polygon points="260,80 70,350 450,350" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <circle cx="260" cy="95" r="10" fill="#0d9488"/><circle cx="85" cy="340" r="10" fill="#d97706"/><circle cx="435" cy="340" r="10" fill="#dc2626"/>
  <text x="260" y="70" text-anchor="middle" font-size="13.5" font-weight="700" fill="#115e59">Private data</text>
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#115e59">topology, configuration</text>
  <text x="70" y="378" font-size="13.5" font-weight="700" fill="#92400e">Untrusted content</text>
  <text x="70" y="393" font-size="11" fill="#92400e">text written by devices</text>
  <text x="450" y="378" text-anchor="end" font-size="13.5" font-weight="700" fill="#991b1b">Ability to act</text>
  <text x="450" y="393" text-anchor="end" font-size="11" fill="#991b1b">restarts, config changes</text>
  <text x="260" y="240" text-anchor="middle" font-size="12.5" fill="#78350f">no egress tool:</text>
  <text x="260" y="258" text-anchor="middle" font-size="12.5" fill="#78350f">data cannot leave</text>
  <text x="260" y="300" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">remaining risk: untrusted text</text>
  <text x="260" y="316" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">→ action</text>

  <text x="600" y="78" font-size="15" font-weight="700" fill="#0f172a">Defence layers on the path text → action</text>
  <g font-size="12.5">
    <rect x="600" y="95" width="460" height="44" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="616" y="122" fill="#4c1d95"><tspan font-weight="700">Spotlighting</tspan> · device text wrapped in &lt;device_text&gt; tags (code)</text>
    <rect x="600" y="147" width="460" height="44" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="616" y="174" fill="#334155"><tspan font-weight="700">Prompt rule</tspan> · device text is data, never an order or approval (model)</text>
    <rect x="600" y="199" width="460" height="44" rx="9" fill="#fef3c7" stroke="#d97706"/>
    <text x="616" y="226" fill="#78350f"><tspan font-weight="700">Approval</tspan> · every change waits for the engineer (code)</text>
    <rect x="600" y="251" width="460" height="44" rx="9" fill="#fee2e2" stroke="#dc2626"/>
    <text x="616" y="278" fill="#7f1d1d"><tspan font-weight="700">Deny list</tspan> · critical assets blocked in the harness and the tool (code)</text>
    <rect x="600" y="303" width="460" height="44" rx="9" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="616" y="330" fill="#0c4a6e"><tspan font-weight="700">Tests + eval</tspan> · 3 security tasks, offline guard tests (CI-ready)</text>
  </g>
</svg>
