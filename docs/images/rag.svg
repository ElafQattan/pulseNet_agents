  <text x="48" y="264" font-size="11" fill="#64748b">via Hugging Face (GSMA)</text>

  <line x1="230" y1="180" x2="275" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="280" y="125" width="160" height="110" rx="12" fill="#f0fdfa" stroke="#0d9488"/>
