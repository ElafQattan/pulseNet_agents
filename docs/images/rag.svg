  <text x="840" y="194" text-anchor="middle" font-size="11.5" fill="#78350f">ranking → first</text>
  <text x="840" y="222" text-anchor="middle" font-size="11" fill="#78350f">config B only</text>

  <line x1="910" y1="180" x2="955" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
