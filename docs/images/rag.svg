<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1100" height="330" rx="14" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Knowledge search (RAG): how PulseNet finds the right passage</text>

  <rect x="30" y="70" width="200" height="220" rx="12" fill="#f8fafc" stroke="#334155"/>
  <text x="130" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Sources</text>
