  <text x="360" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#0d9488">728</text>
  <text x="360" y="224" text-anchor="middle" font-size="11" fill="#115e59">passages</text>

  <line x1="440" y1="160" x2="495" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="200" x2="495" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="500" y="70" width="210" height="85" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="605" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">BM25 (keywords)</text>
  <text x="605" y="120" text-anchor="middle" font-size="11.5" fill="#0c4a6e">exact words, IDs, acronyms</text>
  <text x="605" y="137" text-anchor="middle" font-size="11.5" fill="#0c4a6e">"D-114", "ZSM"</text>
  <rect x="500" y="205" width="210" height="85" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="605" y="233" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Embeddings (meaning)</text>
  <text x="605" y="255" text-anchor="middle" font-size="11.5" fill="#4c1d95">potion-retrieval-32M</text>
  <text x="605" y="272" text-anchor="middle" font-size="11.5" fill="#4c1d95">"internet is slow" ≈ congestion</text>

  <line x1="710" y1="115" x2="765" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="710" y1="245" x2="765" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="770" y="125" width="140" height="110" rx="12" fill="#fef3c7" stroke="#d97706"/>
  <text x="840" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Fuse (RRF)</text>
