<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
  </defs>
  <rect width="1000" height="470" rx="14" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">The closed loop PulseNet follows (ETSI ZSM, ITU-T Y.3173 level L3)</text>

  <circle cx="500" cy="255" r="150" fill="none" stroke="#99f6e4" stroke-width="14"/>
  <circle cx="500" cy="255" r="68" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="500" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#115e59">Intents</text>
  <text x="500" y="269" text-anchor="middle" font-size="11.5" fill="#115e59">the goals the</text>
  <text x="500" y="284" text-anchor="middle" font-size="11.5" fill="#115e59">engineer sets</text>

  <g font-size="12" fill="#334155">
    <rect x="410" y="62" width="180" height="70" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <text x="500" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">1 · Monitor</text>
    <text x="500" y="108" text-anchor="middle">alarms by severity</text>
    <text x="500" y="123" text-anchor="middle">which intents fail</text>

    <rect x="660" y="160" width="200" height="80" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <text x="760" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">2 · Analyse</text>
    <text x="760" y="206" text-anchor="middle">trace paths, blast radius</text>
    <text x="760" y="221" text-anchor="middle">many alarms → one cause</text>

    <rect x="610" y="345" width="210" height="80" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <text x="715" y="371" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">3 · Decide</text>
    <text x="715" y="391" text-anchor="middle">runbooks, past incidents,</text>
    <text x="715" y="406" text-anchor="middle">standards, peak forecast</text>

    <rect x="180" y="345" width="210" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="285" y="371" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">4 · Execute</text>
    <text x="285" y="391" text-anchor="middle" fill="#78350f">only after the engineer</text>
    <text x="285" y="406" text-anchor="middle" fill="#78350f">presses Approve</text>

    <rect x="140" y="160" width="200" height="80" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <text x="240" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">5 · Verify</text>
    <text x="240" y="206" text-anchor="middle">read the asset again</text>
    <text x="240" y="221" text-anchor="middle">are the intents met now?</text>
  </g>
  <g stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M592 105 Q 680 120 720 155"/>
    <path d="M770 242 Q 770 300 740 340"/>
    <path d="M605 388 L 395 388"/>
    <path d="M240 340 Q 220 290 235 245"/>
    <path d="M300 158 Q 340 105 405 100"/>
  </g>
  <text x="890" y="440" text-anchor="end" font-size="11" fill="#64748b">L3: the system collects data and executes; analysis and decision are shared with the human.</text>
</svg>
