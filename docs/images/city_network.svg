<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="600" rx="14" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">The simulated Madinah IoT network after last night's rain</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#6b7280">64 devices · 4 districts · Sunday 1 November 2026, 09:00 · 38.4 mm of rain between 01:30 and 05:10</text>

  <!-- control center -->
  <rect x="330" y="76" width="440" height="84" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="550" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">Control Center</text>
  <rect x="348" y="108" width="230" height="40" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="463" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">CENTER-MQTT data platform</text>
  <text x="463" y="139" text-anchor="middle" font-size="10.5" fill="#9a3412">2,380 connects/min (normal 40)</text>
  <rect x="590" y="108" width="162" height="40" rx="7" fill="#ecfdf5" stroke="#10b981"/>
  <text x="671" y="124" text-anchor="middle" font-size="12" fill="#065f46">CENTER-WEATHER</text>
  <text x="671" y="139" text-anchor="middle" font-size="10.5" fill="#065f46">rain gauge · 38.4 mm</text>

  <g stroke="#9ca3af" stroke-width="2" fill="none">
    <path d="M550 160 L550 178 L140 178 L140 196"/>
    <path d="M550 178 L413 178 L413 196"/>
    <path d="M550 178 L687 178 L687 196"/>
    <path d="M550 178 L960 178 L960 196"/>
  </g>

  <!-- Quba -->
  <rect x="16" y="196" width="248" height="350" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="140" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Quba</text>
  <rect x="30" y="232" width="220" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="140" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Underpass water 46 cm, rising</text>
  <text x="140" y="266" text-anchor="middle" font-size="10.5" fill="#991b1b">QUBA-TUNNEL-01 · close level 40 cm</text>
  <rect x="30" y="284" width="220" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="140" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Pump 1 stopped</text>
  <text x="140" y="318" text-anchor="middle" font-size="10.5" fill="#991b1b">QUBA-PUMP-01 · undervoltage at 03:52</text>
  <rect x="30" y="336" width="220" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="140" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Gateway offline</text>
  <text x="140" y="370" text-anchor="middle" font-size="10.5" fill="#991b1b">QUBA-GATEWAY · out of memory 06:42</text>
  <rect x="30" y="388" width="220" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="140" y="413" text-anchor="middle" font-size="11.5" fill="#7f1d1d">5 lights + 4 parking sensors silent</text>
  <rect x="30" y="436" width="220" height="34" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="140" y="457" text-anchor="middle" font-size="11.5" fill="#065f46">pump 2 · camera · traffic signal</text>

  <!-- Al-Aziziyah -->
  <rect x="289" y="196" width="248" height="350" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="413" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Al-Aziziyah</text>
  <rect x="303" y="232" width="220" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="413" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Traffic signal flashing yellow</text>
  <text x="413" y="266" text-anchor="middle" font-size="10.5" fill="#991b1b">since 03:52 · old firmware advisory</text>
  <rect x="303" y="284" width="220" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="413" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">Storm drain 2 blocked</text>
  <text x="413" y="318" text-anchor="middle" font-size="10.5" fill="#9a3412">88 % full, not falling after the rain</text>
  <rect x="303" y="336" width="220" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="413" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">Water meter 2 weak signal</text>
  <text x="413" y="370" text-anchor="middle" font-size="10.5" fill="#9a3412">NB-IoT −124 dBm, CE2</text>
  <rect x="303" y="388" width="220" height="34" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="413" y="409" text-anchor="middle" font-size="11.5" fill="#065f46">gateway · 4 lights · 2 drains · camera</text>

  <!-- Sultanah -->
  <rect x="563" y="196" width="248" height="350" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="687" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Sultanah</text>
  <rect x="577" y="232" width="220" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="687" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Power cabinet 2 tripped</text>
  <text x="687" y="266" text-anchor="middle" font-size="10.5" fill="#991b1b">earth leakage 186 mA at 02:37 (rain)</text>
  <rect x="577" y="284" width="220" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="687" y="309" text-anchor="middle" font-size="11.5" fill="#7f1d1d">6 streetlights without power</text>
  <rect x="577" y="332" width="220" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="687" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">Parking sensor battery 4 %</text>
  <text x="687" y="366" text-anchor="middle" font-size="10.5" fill="#9a3412">hospital lot, disabled-access bay</text>
  <rect x="577" y="384" width="220" height="34" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="687" y="405" text-anchor="middle" font-size="11.5" fill="#065f46">gateway · cabinet 1 · 4 lights · signal</text>

  <!-- Al-Uyun -->
  <rect x="836" y="196" width="248" height="350" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="960" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Al-Uyun</text>
  <rect x="850" y="232" width="220" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="960" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Camera 2 compromised</text>
  <text x="960" y="266" text-anchor="middle" font-size="10.5" fill="#991b1b">46.7 Mbps out · injected instructions</text>
  <rect x="850" y="284" width="220" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="960" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">6 parking sensors: storm</text>
  <text x="960" y="318" text-anchor="middle" font-size="10.5" fill="#991b1b">retry every 5 s together after power cut</text>
  <rect x="850" y="336" width="220" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="960" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">Streetlight 3 on by day</text>
  <text x="960" y="370" text-anchor="middle" font-size="10.5" fill="#9a3412">clock reset after the power cut</text>
  <rect x="850" y="388" width="220" height="34" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="960" y="409" text-anchor="middle" font-size="11.5" fill="#065f46">gateway · 3 lights · drain · meter · signal</text>
  <text x="960" y="450" text-anchor="middle" font-size="11" fill="#6b7280">power cut 03:52 → 04:25</text>

  <g font-size="11.5" fill="#374151">
    <rect x="370" y="566" width="12" height="12" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="388" y="576">fault</text>
    <rect x="440" y="566" width="12" height="12" rx="3" fill="#fff7ed" stroke="#f97316"/><text x="458" y="576">warning</text>
    <rect x="525" y="566" width="12" height="12" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="543" y="576">normal</text>
    <rect x="600" y="566" width="12" height="12" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2"/><text x="618" y="576">the attack</text>
  </g>
</svg>
