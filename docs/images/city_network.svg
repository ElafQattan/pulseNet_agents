<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" rx="14" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">The simulated smart-city IoT network</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">38 devices · 3 districts · Sunday 1 November 2026, 09:00 · red = a fault PulseNet has to find</text>

  <!-- control center -->
  <rect x="330" y="78" width="300" height="78" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">Control Center</text>
  <rect x="356" y="110" width="248" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="480" y="125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">BROKER-01 (MQTT) · degraded</text>
  <text x="480" y="139" text-anchor="middle" font-size="11" fill="#991b1b">2,380 connects/min, baseline 40</text>

  <!-- links -->
  <g stroke="#9ca3af" stroke-width="2" fill="none">
    <path d="M480 156 L480 176 L165 176 L165 196"/>
    <path d="M480 156 L480 196"/>
    <path d="M480 176 L795 176 L795 196"/>
  </g>

  <!-- Al-Nakheel -->
  <rect x="20" y="196" width="290" height="330" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="165" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Al-Nakheel (NKH)</text>
  <rect x="40" y="232" width="250" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="165" y="250" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">GW-NKH-01 LoRaWAN gateway · offline</text>
  <text x="165" y="266" text-anchor="middle" font-size="11" fill="#991b1b">out of memory at 06:42</text>
  <rect x="40" y="288" width="250" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="165" y="306" text-anchor="middle" font-size="12" fill="#7f1d1d">4 streetlights + 4 parking sensors</text>
  <text x="165" y="321" text-anchor="middle" font-size="11" fill="#7f1d1d">offline behind the gateway</text>
  <rect x="40" y="344" width="250" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="165" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">TL-NKH-01 traffic controller</text>
  <text x="165" y="377" text-anchor="middle" font-size="11" fill="#9a3412">firmware 2.1.0, advisory PN-SA-2026-014</text>
  <rect x="40" y="400" width="250" height="34" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="165" y="421" text-anchor="middle" font-size="12" fill="#065f46">CAM-NKH-01 camera · normal</text>

  <!-- Al-Waha -->
  <rect x="335" y="196" width="290" height="330" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="480" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Al-Waha (WAH)</text>
  <rect x="355" y="232" width="250" height="34" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="480" y="253" text-anchor="middle" font-size="12" fill="#065f46">GW-WAH-01 gateway · online</text>
  <rect x="355" y="278" width="250" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="480" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">PK-WAH-01…06 parking sensors</text>
  <text x="480" y="311" text-anchor="middle" font-size="11" fill="#991b1b">retry every 5 s together: reconnection storm</text>
  <rect x="355" y="334" width="250" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="480" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">SL-WAH-03 streetlight · ON by day</text>
  <text x="480" y="367" text-anchor="middle" font-size="11" fill="#9a3412">clock reset after the power cut</text>
  <rect x="355" y="390" width="250" height="34" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="480" y="411" text-anchor="middle" font-size="12" fill="#065f46">3 streetlights · TL-WAH-01 · CAM-WAH-01</text>
  <text x="480" y="452" text-anchor="middle" font-size="11" fill="#6b7280">power cut 04:58 → 05:31</text>

  <!-- Al-Rawdah -->
  <rect x="650" y="196" width="290" height="330" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="795" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Al-Rawdah (RWD)</text>
  <rect x="670" y="232" width="250" height="34" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="795" y="253" text-anchor="middle" font-size="12" fill="#065f46">GW-RWD-01 gateway · online</text>
  <rect x="670" y="278" width="250" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="795" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">CAM-RWD-02 camera · compromised</text>
  <text x="795" y="311" text-anchor="middle" font-size="11" fill="#991b1b">46.7 Mbps to 203.0.113.66 · injected text</text>
  <rect x="670" y="334" width="250" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="795" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">WM-RWD-02 water meter (NB-IoT)</text>
  <text x="795" y="367" text-anchor="middle" font-size="11" fill="#9a3412">RSRP −124 dBm, CE2, 187 retries</text>
  <rect x="670" y="390" width="250" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="795" y="408" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">PK-RWD-03 parking sensor</text>
  <text x="795" y="423" text-anchor="middle" font-size="11" fill="#9a3412">battery 4 % · disabled-access bay</text>
  <rect x="670" y="446" width="250" height="34" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="795" y="467" text-anchor="middle" font-size="12" fill="#065f46">2 streetlights · 3 sensors · 2 meters · TL · CAM</text>

  <!-- legend -->
  <g font-size="11.5" fill="#374151">
    <rect x="300" y="538" width="12" height="12" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="318" y="548">fault</text>
    <rect x="370" y="538" width="12" height="12" rx="3" fill="#fff7ed" stroke="#f97316"/><text x="388" y="548">warning</text>
    <rect x="455" y="538" width="12" height="12" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="473" y="548">normal</text>
    <rect x="530" y="538" width="12" height="12" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2"/><text x="548" y="548">the attack</text>
  </g>
</svg>
